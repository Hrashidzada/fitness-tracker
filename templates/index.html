<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0d11; --bg2: #13161d; --card: #1a1d27; --border: #252835;
    --text: #e4e5eb; --muted: #7a7d8e; --accent: #56e0a0; --accent2: #5b7cfa;
    --red: #fa5b7c; --orange: #f5a623; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  
  /* ── Auth Screen ── */
  .auth-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
  .auth-box h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .auth-box h1 span { color: var(--accent); }
  .auth-box .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .auth-tabs { display: flex; gap: 0; margin-bottom: 24px; background: var(--bg2); border-radius: 8px; padding: 3px; }
  .auth-tab { flex: 1; padding: 10px; text-align: center; border: none; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
  .auth-tab.active { background: var(--card); color: var(--text); }
  
  /* ── Forms ── */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select { width: 100%; padding: 12px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; transition: border 0.2s; }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #0b0d11; width: 100%; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { opacity: 0.9; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 8px; }
  .success-msg { color: var(--accent); font-size: 13px; margin-top: 8px; }
  
  /* ── App Layout ── */
  .app { display: none; }
  .app.visible { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 50; }
  .topbar .logo { font-size: 20px; font-weight: 700; }
  .topbar .logo span { color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-right .username { color: var(--muted); font-size: 13px; }
  .main-content { max-width: 1100px; margin: 0 auto; padding: 24px; }
  
  /* ── Tabs ── */
  .tabs { display: flex; gap: 4px; background: var(--bg2); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
  .tab { flex: 1; padding: 12px; text-align: center; border: none; background: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
  .tab.active { background: var(--card); color: var(--accent); }
  
  /* ── Panels ── */
  .panel { display: none; }
  .panel.visible { display: block; }
  
  /* ── Date Nav ── */
  .date-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
  .date-nav button { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .date-nav button:hover { border-color: var(--accent); }
  .date-nav .date-display { font-size: 15px; font-weight: 600; min-width: 140px; text-align: center; }
  .date-nav .today-label { color: var(--accent); font-size: 11px; font-weight: 600; }
  
  /* ── Cards ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  
  /* ── Summary Row ── */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .summary-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .summary-item .value { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
  .summary-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .cal-color { color: var(--accent); }
  .pro-color { color: var(--accent2); }
  .carb-color { color: var(--orange); }
  .fat-color { color: var(--red); }
  
  /* ── Add Form ── */
  .add-form { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end; }
  .add-form-workout { grid-template-columns: 1fr auto auto auto auto; }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 10; }
  .search-results .item { padding: 10px 14px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .search-results .item:hover { background: var(--bg2); }
  .search-results .item .cals { color: var(--muted); font-size: 12px; }
  .search-wrap { position: relative; }
  
  /* ── Meal / Workout List ── */
  .log-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-item .name { font-weight: 600; font-size: 14px; text-transform: capitalize; }
  .log-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .log-item .cals { font-weight: 700; font-size: 15px; color: var(--accent); min-width: 70px; text-align: right; }
  .log-item .delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; margin-left: 8px; border-radius: 4px; }
  .log-item .delete-btn:hover { color: var(--red); background: rgba(250,91,124,0.1); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  
  /* ── Charts ── */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .chart-card canvas { max-height: 300px; }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  
  /* ── Responsive ── */
  @media (max-width: 768px) {
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .chart-grid { grid-template-columns: 1fr; }
    .add-form, .add-form-workout { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
    .main-content { padding: 16px; }
  }
  @media (max-width: 480px) {
    .summary-row { grid-template-columns: 1fr 1fr; gap: 8px; }
    .summary-item .value { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- ═══════ AUTH SCREEN ═══════ -->
<div class="auth-wrapper" id="authScreen">
  <div class="auth-box">
    <h1><span>Fit</span>Track</h1>
    <p class="subtitle">Log meals, track workouts, see your progress.</p>
    
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showAuthTab('login')">Log In</button>
      <button class="auth-tab" onclick="showAuthTab('register')">Sign Up</button>
    </div>
    
    <div id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Log In</button>
      <div class="error-msg" id="loginError"></div>
    </div>
    
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUser" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="At least 6 characters">
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Create Account</button>
      <div class="error-msg" id="regError"></div>
    </div>
  </div>
</div>

<!-- ═══════ APP ═══════ -->
<div class="app" id="appScreen">
  <div class="topbar">
    <div class="logo"><span>Fit</span>Track</div>
    <div class="topbar-right">
      <span class="username" id="displayUsername"></span>
      <button class="btn btn-sm btn-outline" onclick="doLogout()">Log Out</button>
    </div>
  </div>
  
  <div class="main-content">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('meals')">Meals</button>
      <button class="tab" onclick="switchTab('workouts')">Workouts</button>
      <button class="tab" onclick="switchTab('charts')">Progress</button>
    </div>

    <!-- ── MEALS PANEL ── -->
    <div class="panel visible" id="panel-meals">
      <!-- Date Nav -->
      <div class="date-nav">
        <button onclick="changeDate(-1)">&larr;</button>
        <div>
          <div class="date-display" id="mealDateDisplay"></div>
          <div class="today-label" id="mealTodayLabel"></div>
        </div>
        <button onclick="changeDate(1)">&rarr;</button>
      </div>

      <!-- Summary -->
      <div class="summary-row" id="mealSummary">
        <div class="summary-item"><div class="value cal-color" id="sumCal">0</div><div class="label">Calories</div></div>
        <div class="summary-item"><div class="value pro-color" id="sumPro">0</div><div class="label">Protein (g)</div></div>
        <div class="summary-item"><div class="value carb-color" id="sumCarb">0</div><div class="label">Carbs (g)</div></div>
        <div class="summary-item"><div class="value fat-color" id="sumFat">0</div><div class="label">Fat (g)</div></div>
      </div>

      <!-- Add Meal -->
      <div class="card">
        <div class="card-title">Log a Meal</div>
        <div class="add-form">
          <div class="search-wrap">
            <input type="text" id="foodSearch" placeholder="Search foods (e.g. chicken breast, banana)" autocomplete="off">
            <div class="search-results" id="foodResults" style="display:none"></div>
          </div>
          <div class="form-group" style="margin:0;min-width:80px">
            <input type="number" id="servingsInput" value="1" min="0.25" step="0.25" placeholder="Qty">
          </div>
          <button class="btn btn-primary btn-sm" onclick="addMeal()" style="height:44px">+ Add</button>
        </div>
        <div id="selectedFood" style="color:var(--muted);font-size:13px;margin-top:8px"></div>
        <div class="error-msg" id="mealError"></div>
      </div>

      <!-- Meal Log -->
      <div class="card">
        <div class="card-title">Today's Meals</div>
        <div id="mealList"></div>
      </div>
    </div>

    <!-- ── WORKOUTS PANEL ── -->
    <div class="panel" id="panel-workouts">
      <div class="date-nav">
        <button onclick="changeDate(-1)">&larr;</button>
        <div>
          <div class="date-display" id="workoutDateDisplay"></div>
          <div class="today-label" id="workoutTodayLabel"></div>
        </div>
        <button onclick="changeDate(1)">&rarr;</button>
      </div>

      <div class="card">
        <div class="card-title">Log a Workout</div>
        <div class="add-form add-form-workout">
          <div class="form-group" style="margin:0">
            <input type="text" id="exerciseInput" placeholder="Exercise (e.g. Bench Press)">
          </div>
          <div class="form-group" style="margin:0;min-width:70px">
            <input type="number" id="setsInput" placeholder="Sets" min="1">
          </div>
          <div class="form-group" style="margin:0;min-width:70px">
            <input type="number" id="repsInput" placeholder="Reps" min="1">
          </div>
          <div class="form-group" style="margin:0;min-width:90px">
            <input type="number" id="weightInput" placeholder="Lbs" min="0" step="2.5">
          </div>
          <button class="btn btn-primary btn-sm" onclick="addWorkout()" style="height:44px">+ Add</button>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
          <span style="color:var(--muted);font-size:12px">Or cardio:</span>
          <input type="number" id="durationInput" placeholder="Minutes" min="1" style="width:100px">
        </div>
        <div class="error-msg" id="workoutError"></div>
      </div>

      <div class="card">
        <div class="card-title">Today's Workouts</div>
        <div id="workoutList"></div>
      </div>
    </div>

    <!-- ── CHARTS PANEL ── -->
    <div class="panel" id="panel-charts">
      <div class="chart-grid">
        <div class="chart-card">
          <h3>Daily Calories (Past 30 Days)</h3>
          <canvas id="calorieChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Macros Breakdown (Past 30 Days)</h3>
          <canvas id="macroChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Workout Frequency (Past 30 Days)</h3>
          <canvas id="workoutChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Today's Macro Split</h3>
          <canvas id="macroPie"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════ STATE ═══════ */
let currentDate = new Date();
let selectedFoodName = null;
let calorieChart, macroChart, workoutChart, macroPieChart;

const fmt = d => d.toISOString().split("T")[0];
const fmtDisplay = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const isToday = d => fmt(d) === fmt(new Date());

/* ═══════ API HELPERS ═══════ */
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

/* ═══════ AUTH ═══════ */
function showAuthTab(tab) {
  document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
  document.getElementById("registerForm").style.display = tab === "register" ? "block" : "none";
  document.querySelectorAll(".auth-tab").forEach((t, i) => {
    t.classList.toggle("active", (i === 0 && tab === "login") || (i === 1 && tab === "register"));
  });
}

async function doLogin() {
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      body: { username: document.getElementById("loginUser").value, password: document.getElementById("loginPass").value }
    });
    enterApp(data.username);
  } catch (e) { document.getElementById("loginError").textContent = e.message; }
}

async function doRegister() {
  try {
    const data = await api("/api/auth/register", {
      method: "POST",
      body: { username: document.getElementById("regUser").value, password: document.getElementById("regPass").value }
    });
    enterApp(data.username);
  } catch (e) { document.getElementById("regError").textContent = e.message; }
}

async function doLogout() {
  await api("/api/auth/logout", { method: "POST" });
  document.getElementById("authScreen").style.display = "flex";
  document.getElementById("appScreen").classList.remove("visible");
}

function enterApp(username) {
  document.getElementById("displayUsername").textContent = username;
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appScreen").classList.add("visible");
  currentDate = new Date();
  updateDateDisplays();
  loadMeals();
  loadWorkouts();
}

/* ═══════ CHECK SESSION ═══════ */
async function checkSession() {
  try {
    const data = await api("/api/auth/me");
    if (data.logged_in) enterApp(data.username);
  } catch (e) {}
}

/* ═══════ TABS ═══════ */
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("visible"));
  event.target.classList.add("active");
  document.getElementById("panel-" + name).classList.add("visible");
  if (name === "charts") loadCharts();
}

/* ═══════ DATE NAV ═══════ */
function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  updateDateDisplays();
  loadMeals();
  loadWorkouts();
}

function updateDateDisplays() {
  const display = fmtDisplay(currentDate);
  const today = isToday(currentDate) ? "Today" : "";
  document.getElementById("mealDateDisplay").textContent = display;
  document.getElementById("mealTodayLabel").textContent = today;
  document.getElementById("workoutDateDisplay").textContent = display;
  document.getElementById("workoutTodayLabel").textContent = today;
}

/* ═══════ FOOD SEARCH ═══════ */
const foodInput = document.getElementById("foodSearch");
let searchTimeout;
foodInput.addEventListener("input", () => {
  clearTimeout(searchTimeout);
  const q = foodInput.value.trim();
  if (q.length < 2) { document.getElementById("foodResults").style.display = "none"; return; }
  searchTimeout = setTimeout(async () => {
    try {
      const results = await api(`/api/foods/search?q=${encodeURIComponent(q)}`);
      const el = document.getElementById("foodResults");
      if (results.length === 0) { el.style.display = "none"; return; }
      el.innerHTML = results.map(f =>
        `<div class="item" onclick="selectFood('${f.name.replace(/'/g, "\\'")}', ${f.calories})">`
        + `<span>${f.name}</span><span class="cals">${f.calories} cal / ${f.serving}</span></div>`
      ).join("");
      el.style.display = "block";
    } catch (e) {}
  }, 250);
});

foodInput.addEventListener("focus", () => {
  if (document.getElementById("foodResults").innerHTML) document.getElementById("foodResults").style.display = "block";
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) document.getElementById("foodResults").style.display = "none";
});

function selectFood(name, cals) {
  selectedFoodName = name;
  foodInput.value = name;
  document.getElementById("foodResults").style.display = "none";
  document.getElementById("selectedFood").textContent = `Selected: ${name} (${cals} cal per serving)`;
}

/* ═══════ MEALS ═══════ */
async function loadMeals() {
  try {
    const data = await api(`/api/meals?date=${fmt(currentDate)}`);
    document.getElementById("sumCal").textContent = Math.round(data.totals.calories);
    document.getElementById("sumPro").textContent = Math.round(data.totals.protein);
    document.getElementById("sumCarb").textContent = Math.round(data.totals.carbs);
    document.getElementById("sumFat").textContent = Math.round(data.totals.fat);

    const list = document.getElementById("mealList");
    if (data.meals.length === 0) {
      list.innerHTML = '<div class="empty-state">No meals logged. Search for a food above to get started.</div>';
    } else {
      list.innerHTML = data.meals.map(m => `
        <div class="log-item">
          <div>
            <div class="name">${m.food_name}</div>
            <div class="meta">${m.servings} serving${m.servings !== 1 ? 's' : ''} · ${Math.round(m.protein)}g P · ${Math.round(m.carbs)}g C · ${Math.round(m.fat)}g F</div>
          </div>
          <div style="display:flex;align-items:center">
            <div class="cals">${Math.round(m.calories)}</div>
            <button class="delete-btn" onclick="deleteMeal(${m.id})">✕</button>
          </div>
        </div>
      `).join("");
    }
  } catch (e) { console.error(e); }
}

async function addMeal() {
  const errEl = document.getElementById("mealError");
  errEl.textContent = "";
  if (!selectedFoodName) { errEl.textContent = "Search and select a food first"; return; }
  const servings = parseFloat(document.getElementById("servingsInput").value) || 1;
  try {
    await api("/api/meals", { method: "POST", body: { food_name: selectedFoodName, servings, date: fmt(currentDate) } });
    selectedFoodName = null;
    foodInput.value = "";
    document.getElementById("selectedFood").textContent = "";
    document.getElementById("servingsInput").value = 1;
    loadMeals();
  } catch (e) { errEl.textContent = e.message; }
}

async function deleteMeal(id) {
  await api(`/api/meals/${id}`, { method: "DELETE" });
  loadMeals();
}

/* ═══════ WORKOUTS ═══════ */
async function loadWorkouts() {
  try {
    const data = await api(`/api/workouts?date=${fmt(currentDate)}`);
    const list = document.getElementById("workoutList");
    if (data.workouts.length === 0) {
      list.innerHTML = '<div class="empty-state">No workouts logged today.</div>';
    } else {
      list.innerHTML = data.workouts.map(w => {
        let detail = "";
        if (w.sets && w.reps) detail += `${w.sets}×${w.reps}`;
        if (w.weight) detail += ` @ ${w.weight} lbs`;
        if (w.duration_minutes) detail += `${detail ? " · " : ""}${w.duration_minutes} min`;
        return `
          <div class="log-item">
            <div>
              <div class="name">${w.exercise}</div>
              <div class="meta">${detail || "Logged"}</div>
            </div>
            <button class="delete-btn" onclick="deleteWorkout(${w.id})">✕</button>
          </div>
        `;
      }).join("");
    }
  } catch (e) { console.error(e); }
}

async function addWorkout() {
  const errEl = document.getElementById("workoutError");
  errEl.textContent = "";
  const exercise = document.getElementById("exerciseInput").value.trim();
  if (!exercise) { errEl.textContent = "Enter an exercise name"; return; }
  const sets = parseInt(document.getElementById("setsInput").value) || null;
  const reps = parseInt(document.getElementById("repsInput").value) || null;
  const weight = parseFloat(document.getElementById("weightInput").value) || null;
  const duration = parseFloat(document.getElementById("durationInput").value) || null;
  try {
    await api("/api/workouts", { method: "POST", body: { exercise, sets, reps, weight, duration_minutes: duration, date: fmt(currentDate) } });
    document.getElementById("exerciseInput").value = "";
    document.getElementById("setsInput").value = "";
    document.getElementById("repsInput").value = "";
    document.getElementById("weightInput").value = "";
    document.getElementById("durationInput").value = "";
    loadWorkouts();
  } catch (e) { errEl.textContent = e.message; }
}

async function deleteWorkout(id) {
  await api(`/api/workouts/${id}`, { method: "DELETE" });
  loadWorkouts();
}

/* ═══════ CHARTS ═══════ */
const chartDefaults = {
  responsive: true,
  maintainAspectRatio: true,
  plugins: { legend: { labels: { color: "#7a7d8e", font: { size: 11 } } } },
  scales: {
    x: { ticks: { color: "#7a7d8e", font: { size: 10 } }, grid: { color: "#252835" } },
    y: { ticks: { color: "#7a7d8e", font: { size: 10 } }, grid: { color: "#252835" } },
  }
};

async function loadCharts() {
  try {
    const [calData, macroData, workoutData, todayMeals] = await Promise.all([
      api("/api/stats/calories?days=30"),
      api("/api/stats/macros?days=30"),
      api("/api/stats/workouts?days=30"),
      api(`/api/meals?date=${fmt(new Date())}`),
    ]);

    // Calorie line chart
    if (calorieChart) calorieChart.destroy();
    calorieChart = new Chart(document.getElementById("calorieChart"), {
      type: "line",
      data: {
        labels: calData.map(d => d.date.slice(5)),
        datasets: [{
          label: "Calories",
          data: calData.map(d => d.calories),
          borderColor: "#56e0a0",
          backgroundColor: "rgba(86,224,160,0.1)",
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: "#56e0a0",
        }]
      },
      options: { ...chartDefaults }
    });

    // Macro stacked bar
    if (macroChart) macroChart.destroy();
    macroChart = new Chart(document.getElementById("macroChart"), {
      type: "bar",
      data: {
        labels: macroData.map(d => d.date.slice(5)),
        datasets: [
          { label: "Protein", data: macroData.map(d => d.protein), backgroundColor: "#5b7cfa", borderRadius: 3 },
          { label: "Carbs", data: macroData.map(d => d.carbs), backgroundColor: "#f5a623", borderRadius: 3 },
          { label: "Fat", data: macroData.map(d => d.fat), backgroundColor: "#fa5b7c", borderRadius: 3 },
        ]
      },
      options: { ...chartDefaults, scales: { ...chartDefaults.scales, x: { ...chartDefaults.scales.x, stacked: true }, y: { ...chartDefaults.scales.y, stacked: true } } }
    });

    // Workout frequency bar
    if (workoutChart) workoutChart.destroy();
    workoutChart = new Chart(document.getElementById("workoutChart"), {
      type: "bar",
      data: {
        labels: workoutData.map(d => d.date.slice(5)),
        datasets: [{
          label: "Exercises",
          data: workoutData.map(d => d.count),
          backgroundColor: "#56e0a0",
          borderRadius: 4,
        }]
      },
      options: { ...chartDefaults }
    });

    // Macro pie for today
    if (macroPieChart) macroPieChart.destroy();
    const t = todayMeals.totals;
    macroPieChart = new Chart(document.getElementById("macroPie"), {
      type: "doughnut",
      data: {
        labels: ["Protein", "Carbs", "Fat"],
        datasets: [{
          data: [Math.round(t.protein), Math.round(t.carbs), Math.round(t.fat)],
          backgroundColor: ["#5b7cfa", "#f5a623", "#fa5b7c"],
          borderWidth: 0,
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: "bottom", labels: { color: "#7a7d8e", padding: 16, font: { size: 12 } } }
        }
      }
    });
  } catch (e) { console.error(e); }
}

/* ═══════ ENTER KEY SUPPORT ═══════ */
document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
document.getElementById("regPass").addEventListener("keydown", e => { if (e.key === "Enter") doRegister(); });
document.getElementById("exerciseInput").addEventListener("keydown", e => { if (e.key === "Enter") addWorkout(); });

/* ═══════ INIT ═══════ */
checkSession();
</script>
